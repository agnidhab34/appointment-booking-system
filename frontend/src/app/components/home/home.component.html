<div class="container">
  <div class="card" style="text-align:center; padding: 60px 20px;">
    <h1>Online Appointment Booking &amp; Scheduling System</h1>
    <p>Book appointments with service providers quickly and easily.</p>

    @if (!auth.isLoggedIn()) {
      <div style="margin-top: 20px;">
        <a routerLink="/register" class="btn btn-primary">Get Started</a>
        <a routerLink="/login" class="btn btn-secondary" style="margin-left: 10px;">Login</a>
      </div>
    } @else if (auth.getRole() === 'customer') {
      <a routerLink="/services" class="btn btn-primary">Browse Services</a>
    } @else {
      <a routerLink="/provider/dashboard" class="btn btn-primary">Go to Dashboard</a>
    }
  </div>
</div>
